name: 构建 FilmWeaver Windows 安装包

# 触发方式：手动点击 或 推送 tag(如 v0.1.0)
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 依赖
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: 安装前端依赖
        run: npm install

      - name: 编译打包 Windows 安装包
        run: npx tauri build

      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: FilmWeaver-Windows安装包
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: 发布 Release（推送 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FilmWeaver 织影 ${{ github.ref_name }}
          files: src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}